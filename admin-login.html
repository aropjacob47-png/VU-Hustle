<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin login | VU Hustle</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<div id="crumbs"></div>
<main id="main">
<div id="flash"></div>
<section class="section"><div class="container">
    <h1>Admin login</h1>
    <div id="loginErrors"></div>
    <form class="form" id="loginForm" novalidate>
        <div class="field"><label for="username">Username</label><input type="text" id="username" required autocomplete="username"></div>
        <div class="field"><label for="password">Password</label><input type="password" id="password" required autocomplete="current-password"></div>
        <button class="btn btn-primary" type="submit">Log in</button>
    </form>
</div></section>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
