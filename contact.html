<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | VU Hustle</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-crumbs='[["Home", "index.html"], ["Contact", null]]'>
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>
<div id="crumbs"></div>
<main id="main">
<div id="flash"></div>
<section class="section"><div class="container">
    <h1>Contact</h1>
    <p>Questions, problems or ideas? Send us a message.</p>
    <p><strong>Email:</strong> <span id="contactEmail"></span><br><strong>WhatsApp:</strong> <span id="contactWa"></span></p>
    <div id="contactErrors"></div>
    <form class="form" id="contactForm" novalidate>
        <div class="field"><label for="name">Name</label><input type="text" id="name" maxlength="80" required></div>
        <div class="field"><label for="email">Email</label><input type="email" id="email" maxlength="120" required></div>
        <div class="field"><label for="message">Message</label><textarea id="message" maxlength="1000" required></textarea></div>
        <button class="btn btn-primary" type="submit">Send</button>
    </form>
</div></section>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
